<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h2><b> (≧▽≦*) tic-tac-toe (≧▽≦*)</b></h2>
    <div class="controls">
        <button id="mode">Change Background Mode!!</button>
        <button id="game-mode-btn">Game Mode: Player vs Player</button>
    </div>
    <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExemozenl1ODBuMWttb25qZG56ZXQ0eTVwcXpxMHRhbTA3eDJ3ZGhzeCZlcD12MV9zdGlja2Vyc19zZWFyY2gmY3Q9cw/KZh5bFSMOqVUlQdbQB/giphy.gif" alt=" flying bat">
    <br>
    <div class="msg-container hide">
        <p id="msg">WINNER!!</p>
        <button id="new-btn">[New Game]</button>
    </div>
    <button id="reset">Reset Game</button>
    
    <div class="container">
        
        <div class="game">
            <button class="box"></button>
            <button class="box"></button>
            <button class="box"></button>
            <button class="box"></button>
            <button class="box"></button>
            <button class="box"></button>
            <button class="box"></button>
            <button class="box"></button>
            <button class="box"></button>
        </div>
        
    </div>
    
</main>
</body> 
<script src="script.js"></script>
</html>
